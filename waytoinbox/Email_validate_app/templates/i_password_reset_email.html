<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <p>Dear User,</p>
    <p>We received a request to reset your password. If you made this request, please click below:</p>
    <p style="text-align: center;">
        <a href="{{ reset_link }}" style="background-color: #007bff; color: white; padding: 10px 20px; text-decoration: none; font-size: 16px; border-radius: 5px;">
            Reset Password
        </a>
    </p>
    <p>If the button above doesn’t work, you can use this link:</p>
    <p><a href="{{ reset_link }}">{{ reset_link }}</a></p>
    <p>This link is valid for <strong>1 hour</strong>.</p>
    <p>Regards,<br><strong>Waytoinbox</strong><br><a href="mailto:support@yourcompany.com">support@yourcompany.com</a></p>
</body>
</html>
