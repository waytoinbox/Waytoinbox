{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password - Waytoinbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="icon" href="{% static 'Email_validate_app/img/Waytoinbox_logo.png' %}" type="image/png"/>
  <link rel="stylesheet" href="{% static 'Email_validate_app/css/components.css' %}"/>
  <link rel="stylesheet" href="{% static 'Email_validate_app/css/tokens-reset-utilities.css' %}"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="fp-card">

  <!-- Top accent -->
  <div class="fp-top">
    <div class="fp-logo">
      <img src="{% static 'Email_validate_app/img/Waytoinbox_logo.png' %}" alt="Waytoinbox" style="width:36px;height:36px;object-fit:contain;"/>
      <span class="fp-logo-name">Wayto<span>inbox</span></span>
    </div>
    <div class=”fp-icon-wrap”>&#128274;</div>
    <h2>Forgot Password?</h2>
    <p>No worries &ndash; enter your email and we'll send you a reset link right away.</p>
  </div>

  <!-- Form body -->
  <div class="fp-body">

    <div id="fpAlert"></div>

    <form id="fpForm">
      {% csrf_token %}
      <label class="fp-label" for="email">Email address</label>
      <input
        class="fp-input" type="email"
        id="email" name="email"
        placeholder="you@company.com"
        required autocomplete="off"
      />
      <button type="submit" class="fp-btn" id="fpBtn">
        <i class="fas fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <div class="fp-links">
      <a href="{% url 'login' %}" class="fp-link">
        <i class="fas fa-arrow-left"></i> Back to login
      </a>
      <a href="{% url 'home' %}" class="fp-link">
        <i class="fas fa-home"></i> Home
      </a>
    </div>

  </div>
</div>

<script>
document.getElementById('fpForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const alertEl = document.getElementById('fpAlert');
  const btn     = document.getElementById('fpBtn');
  alertEl.innerHTML = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="fp-btn-spinner"></span> Sending...';

  try {
    const res  = await fetch("{% url 'forgot_password' %}", { method: 'POST', body: new FormData(this) });
    const data = await res.json();
    const cls  = data.status === 'success' ? 'success' : 'error';
    alertEl.innerHTML = `<div class="fp-alert fp-alert--${cls}">${data.message}</div>`;
    if (data.status === 'success') this.reset();
  } catch (err) {
    alertEl.innerHTML = `<div class="fp-alert fp-alert--error">Something went wrong. Please try again.</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Reset Link';
  }
});
</script>

</body>
</html>
