<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forbidden — Waytoinbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .card { background: #fff; border-radius: 16px; padding: 3rem 2.5rem; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .code { font-size: 6rem; font-weight: 800; color: #e2e8f0; line-height: 1; margin-bottom: .5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .75rem; }
    p { color: #64748b; line-height: 1.6; margin-bottom: 2rem; }
    .btn { display: inline-block; background: #4f46e5; color: #fff; padding: .75rem 2rem; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background .2s; }
    .btn:hover { background: #4338ca; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">403</div>
    <h1>Access Denied</h1>
    <p>You don't have permission to access this page.</p>
    <a href="/" class="btn">Go to Dashboard</a>
  </div>
</body>
</html>
