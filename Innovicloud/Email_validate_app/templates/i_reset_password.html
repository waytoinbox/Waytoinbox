{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - Waytoinbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="icon" href="{% static 'Email_validate_app/img/Waytoinbox_logo.png' %}" type="image/png"/>
  <link rel="stylesheet" href="{% static 'Email_validate_app/css/components.css' %}"/>
  <link rel="stylesheet" href="{% static 'Email_validate_app/css/tokens-reset-utilities.css' %}"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="rp-card">

  <!-- Top -->
  <div class="rp-top">
    <div class="rp-logo">
      <img src="{% static 'Email_validate_app/img/Waytoinbox_logo.png' %}" alt="Waytoinbox" style="width:36px;height:36px;object-fit:contain;"/>
      <span class="rp-logo-name">Wayto<span>inbox</span></span>
    </div>
    <div class=”rp-icon-wrap”>&#128274;</div>
    <h2>Reset Password</h2>
    <p>Choose a strong new password for your account.</p>
  </div>

  <!-- Body -->
  <div class="rp-body">

    <div id="rpAlert"></div>

    <form id="rpForm">
      {% csrf_token %}

      <label class="rp-label" for="new_password">New password</label>
      <div class="rp-input-wrap">
        <input
          class="rp-input" type="password"
          name="new_password" id="new_password"
          placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
          required aria-describedby="password-error"
        />
        <i class="fa-solid fa-eye-slash rp-toggle-pw" id="togglePassword"></i>
      </div>

      <!-- Strength bars -->
      <div class="rp-strength">
        <div class="rp-strength-bar" id="bar1"></div>
        <div class="rp-strength-bar" id="bar2"></div>
        <div class="rp-strength-bar" id="bar3"></div>
        <div class="rp-strength-bar" id="bar4"></div>
      </div>

      <div class="rp-field-error" id="password-error">
        Password must be at least 8 characters and include uppercase, lowercase, a number, and a special character.
      </div>

      <button type="submit" class="rp-btn" id="rpBtn">
        <i class="fas fa-lock"></i> Save New Password
      </button>
    </form>

    <div class="rp-footer">
      Remember your password?
      <a href="{% url 'login' %}" class="rp-link">
        <i class="fas fa-sign-in-alt"></i> Sign in
      </a>
    </div>

  </div>
</div>

<script>
/* â”€â”€ Password toggle â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
document.getElementById('togglePassword').addEventListener('click', function() {
  const pw = document.getElementById('new_password');
  const isHidden = pw.type === 'password';
  pw.type = isHidden ? 'text' : 'password';
  this.classList.toggle('fa-eye-slash', !isHidden);
  this.classList.toggle('fa-eye', isHidden);
});

/* â”€â”€ Password strength â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
function getStrength(val) {
  let score = 0;
  if (val.length >= 8) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/\d/.test(val)) score++;
  if (/[@$!%*?&]/.test(val)) score++;
  return score;
}

function updateStrength(val) {
  const score = getStrength(val);
  const barColors = ['weak', 'medium', 'medium', 'strong'];
  for (let i = 1; i <= 4; i++) {
    const bar = document.getElementById('bar' + i);
    bar.className = 'rp-strength-bar';
    if (i <= score) bar.classList.add(barColors[i - 1]);
  }
}

/* â”€â”€ Validation â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
const validatePw = v =>
  /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/.test(v);

const debounce = (fn, ms) => {
  let t;
  return function(...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
};

document.getElementById('new_password').addEventListener('input', debounce(function() {
  updateStrength(this.value);
  const valid = validatePw(this.value);
  const err = document.getElementById('password-error');
  err.classList.toggle('show', !valid && this.value.length > 0);
  this.classList.toggle('error', !valid && this.value.length > 0);
}, 300));

/* â”€â”€ Form submit â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
document.getElementById('rpForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const pw      = document.getElementById('new_password');
  const alertEl = document.getElementById('rpAlert');
  const btn     = document.getElementById('rpBtn');

  if (!validatePw(pw.value)) {
    document.getElementById('password-error').classList.add('show');
    pw.classList.add('error');
    return;
  }

  alertEl.innerHTML = '';
  btn.disabled = true;
  btn.innerHTML = '<span class=”rp-btn-spinner”></span> Saving...';

  try {
    const res  = await fetch('', { method: 'POST', body: new FormData(this) });
    const data = await res.json();
    if (data.status === 'ok') {
      alertEl.innerHTML = `<div class=”rp-alert rp-alert--success”>${data.message}</div>`;
      setTimeout(() => { window.location.href = data.redirect; }, 1500);
    } else {
      alertEl.innerHTML = `<div class=”rp-alert rp-alert--error”>${data.message}</div>`;
      btn.disabled = false;
      btn.innerHTML = '<i class=”fas fa-lock”></i> Save New Password';
    }
  } catch (err) {
    alertEl.innerHTML = `<div class=”rp-alert rp-alert--error”>Something went wrong. Please try again.</div>`;
    btn.disabled = false;
    btn.innerHTML = '<i class=”fas fa-lock”></i> Save New Password';
  }
});
</script>

</body>
</html>
